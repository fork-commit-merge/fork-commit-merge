<!-- Tailwind CSS - Easy -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fork, Commit, Merge - Tailwind CSS</title>
    <link href="../output.css" rel="stylesheet" />
</head>

<body class="m-5 flex justify-center items-center min-h-screen bg-gray-100">

    <div class="max-w-4xl mx-auto">
        <div class="flex flex-col md:flex-row overflow-hidden rounded-xl bg-white shadow-lg">

            <div class="md:w-1/3">
                <img
                    class="h-48 w-full object-cover md:h-full"
                    src="https://source.unsplash.com/random/480x480"
                    alt="Random Image"
                />
            </div>

            <div class="p-6 md:w-2/3">
                <div class="text-sm font-semibold uppercase tracking-wide text-indigo-500">
                    Category
                </div>

                <h2 class="mt-2 text-2xl font-bold text-gray-900">
                    Card Title
                </h2>

                <a href="#" class="mt-2 inline-block text-indigo-600 hover:text-indigo-800">
                    Card Subtitle
                </a>

                <p class="mt-3 text-gray-600">
                    This is some body text to explain more about the card.
                </p>

                <button class="mt-5 rounded-lg bg-indigo-600 px-5 py-2 text-white hover:bg-indigo-700">
                    Call to Action
                </button>
            </div>

        </div>
    </div>

</body>
</html>
