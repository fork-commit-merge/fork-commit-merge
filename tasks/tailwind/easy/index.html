<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Component</title>
  <!-- Keep the existing stylesheet link from your original index.html here -->
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="flex justify-center p-4">
    <div class="flex flex-col md:flex-row w-full max-w-md md:max-w-2xl bg-white rounded-xl shadow-md overflow-hidden">
      <!-- Image: left side on medium+ screens, top on mobile -->
      <img
        class="w-full md:w-56 h-48 md:h-auto object-cover flex-shrink-0"
        src="https://picsum.photos/400/300"
        alt="Card image"
      />

      <!-- Text and button: right side on medium+ screens -->
      <div class="flex flex-col justify-between p-6">
        <div>
          <h2 class="text-xl font-bold text-gray-900">Card Title</h2>
          <h3 class="mt-1 text-sm font-medium text-indigo-600">Card subtitle</h3>
          <p class="mt-3 text-gray-600 text-sm leading-relaxed">
            This is some body text for the card. It describes the content briefly
            and adapts smoothly as the screen size changes.
          </p>
        </div>

        <button class="mt-5 self-start px-4 py-2 rounded-md bg-indigo-600 text-white font-semibold hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition">
          Learn More
        </button>
      </div>
    </div>
  </div>
</body>
</html>
