<!-- Tailwind CSS - Easy -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fork, Commit, Merge - Tailwind CSS - Easy</title>
    <link href="../output.css" rel="stylesheet" />
  </head>
  <body class="m-5 flex justify-center items-center min-h-screen bg-gray-100">
    <!-- Add Tailwind CSS classes -->
    <div class="max-w-2xl overflow-hidden rounded-xl bg-white shadow-lg">

      <div class="flex flex-col sm:flex-row">
        <div class="shrink-0">
          <img
            class="h-48 w-full object-cover md:h-full md:w-48"
            src="/assets/images/fork-commit-merge-logo.jpg"
            alt="Random Image"
          />
        </div>
        <div class="p-6">
          <div class="mb-2 inline-block rounded-full bg-blue-100 px-3 py-1 text-sm font-semibold text-blue-700">Category</div>
          <h2 class="mb-2 text-2xl font-bold text-gray-900">Card Title</h2>
          <a href="#" class="mb-3 inline-block text-sm font-medium text-blue-600 hover:underline">Card Subtitle</a>
          <p class="mb-5 text-gray-600 leading-relaxed">This is some body text to explain more about the card.</p>
          <button class="rounded-lg bg-blue-600 px-5 py-2 font-semibold text-white transition hover:bg-blue-700">Call to Action</button>
        </div>
      </div>
    </div>
  </body>
</html>
