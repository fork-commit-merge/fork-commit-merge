<!-- Tailwind CSS - Easy -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fork, Commit, Merge - Tailwind CSS - Easy</title>
    <link href="../output.css" rel="stylesheet" />
  </head>
  <body class="m-5 flex justify-center items-center min-h-screen bg-gray-100">
    <!-- Add Tailwind CSS classes -->
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl">
      <div class="md:flex">
        <div class="md:shrink-0">
          <img
            class="h-48 w-full object-cover md:h-full md:w-48"
            src="https://source.unsplash.com/random/480x480"
            alt="Random Image"
          />
        </div>
        <div class="p-8">
          <div class="uppercase tracking-wide text-sm text-indigo-500 font-semibold">Category</div>
          <h2 class="block mt-1 text-lg leading-tight font-medium text-black">Card Title</h2>
          <a href="#" class="block mt-1 text-sm text-gray-500 hover:text-gray-700">Card Subtitle</a>
          <p class="mt-2 text-slate-500">This is some body text to explain more about the card.</p>
          <button class="mt-4 px-4 py-2 bg-indigo-600 text-white text-sm font-semibold rounded-lg shadow hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition duration-150 ease-in-out">Call to Action</button>
        </div>
      </div>
    </div>
  </body>
</html>
