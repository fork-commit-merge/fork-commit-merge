<!-- Tailwind CSS - Easy -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fork, Commit, Merge - Tailwind CSS - Easy</title>
    <link href="../output.css" rel="stylesheet" />
  </head>
  <body class="m-5 flex justify-center items-center min-h-screen bg-gray-100">
    <!-- Add Tailwind CSS classes -->
    <div class="bg-white rounded-lg shadow-lg overflow-hidden max-w-xl w-full">
      <div class="flex flex-col md:flex-row">
        <div class="md:w-48 flex-shrink-0">
          <img
            class="h-48 w-full object-cover md:h-full md:w-48"
            src="https://source.unsplash.com/random/480x480"
            alt="Random Image"
          />
        </div>
        <div class="flex-1 p-6">
          <div class="text-sm text-gray-500 uppercase tracking-wide">Category</div>
          <h2 class="text-2xl font-bold text-gray-900 mt-2">Card Title</h2>
          <a href="#" class="text-blue-600 hover:text-blue-800 font-medium">Card Subtitle</a>
          <p class="text-gray-600 mt-4 leading-relaxed">This is some body text to explain more about the card.</p>
          <button class="mt-6 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md transition">
            Call to Action
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
